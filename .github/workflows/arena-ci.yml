name: Arena Python CI
on:
  pull_request:
    paths:
      - '.claude/skills/arena/**'
      - '.claude/tests/**'
      - '.github/workflows/arena-ci.yml'
  push:
    branches: [main]
    paths:
      - '.claude/skills/arena/**'
      - '.claude/tests/**'
      - '.github/workflows/arena-ci.yml'
permissions:
  contents: read
jobs:
  arena-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s .claude/tests -v
